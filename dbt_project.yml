# ==============================================================================
# FILE        : dbt_project.yml
# PURPOSE     : dbt project configuration for wholesale distribution pipeline
# DESCRIPTION : Defines materialization strategies, schema assignments, and
#               tag conventions for all three medallion layers.
#               Bronze is incremental Delta with merge.
#               Silver is incremental Delta with merge and 3 day lookback.
#               Gold is incremental Delta with merge and KPI ready aggregations.
# ==============================================================================

name              : wholesale_distribution_pipeline
version           : "1.0.0"
config-version    : 2

profile           : wholesale_fabric

model-paths       : ["models"]
test-paths        : ["tests"]
seed-paths        : ["seeds"]
macro-paths       : ["macros"]

target-path       : "target"
clean-targets     : ["target", "dbt_packages"]


models:
  wholesale_distribution_pipeline:

    bronze:
      +materialized         : incremental
      +file_format          : delta
      +schema               : bronze
      +tags                 : ["bronze"]
      +on_schema_change     : sync_all_columns

    silver:
      +materialized         : incremental
      +file_format          : delta
      +schema               : silver
      +tags                 : ["silver"]
      +on_schema_change     : sync_all_columns

    gold:
      +materialized         : incremental
      +file_format          : delta
      +schema               : gold
      +tags                 : ["gold"]
      +on_schema_change     : sync_all_columns


vars:
  # Lookback window in days for incremental processing
  incremental_lookback_days : 3

  # NDD success rate threshold below which a carrier is flagged RED
  ndd_red_threshold_pct     : 85.0

  # Low stock WATCH threshold as a multiplier above reorder point
  watch_buffer_multiplier   : 1.20
